name: Windows Simplified Chinese portable

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
      - name: Install frontend dependencies
        run: npm ci
      - name: Test frontend
        run: npm test
      - name: Test Rust
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml
      - name: Build portable executable
        run: npm run tauri:build -- --no-bundle
      - name: Package Simplified Chinese portable
        shell: pwsh
        run: |
          ./scripts/package-portable.ps1
          $version = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          New-Item -ItemType Directory -Path portable-output | Out-Null
          $archive = "QuotaGem_${version}_zh-CN_x64-portable.zip"
          Copy-Item "src-tauri/target/release/bundle/portable/QuotaGem_${version}_x64-portable.zip" "portable-output/$archive"
          $hash = (Get-FileHash "portable-output/$archive" -Algorithm SHA256).Hash.ToLower()
          "$hash  $archive" | Set-Content portable-output/SHA256SUMS.txt -Encoding utf8
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: QuotaGem-zh-CN-windows-x64-portable
          path: portable-output/*
          if-no-files-found: error
          retention-days: 30
